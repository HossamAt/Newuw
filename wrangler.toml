name = "onestate-hub-api"
main = "src/index.ts"
compatibility_date = "2026-10-05"

# بعد إنشاء D1 استبدل القيمة بالـ Database ID الحقيقي
[[d1_databases]]
binding = "DB"
database_name = "onestate-hub-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# أنشئ R2 bucket بهذا الاسم
[vars]
DISCORD_CLIENT_ID = "REPLACE_WITH_DISCORD_APPLICATION_ID"
DISCORD_REDIRECT_URI = "https://YOUR-WORKER-DOMAIN/auth/discord/callback"
OWNER_DISCORD_USER_ID = "REPLACE_WITH_YOUR_DISCORD_USER_ID"
ANDROID_APP_URL = "onestatehub://auth/callback"
